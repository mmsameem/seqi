name: CI & Deployment Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-build:
    name: Verify Build & Server Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Script
        run: npm run build

      - name: Test Server Launch
        env:
          NODE_ENV: production
          PORT: 3000
          JWT_SECRET: github-actions-test-secret-at-least-32-chars
          DEFAULT_ADMIN_USERNAME: admin
          DEFAULT_ADMIN_PASSWORD: testpassword123
        run: |
          node server.js &
          PID=$!
          sleep 4
          curl -f http://localhost:3000/favicon.ico || (kill $PID && exit 1)
          kill $PID
