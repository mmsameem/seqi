services:
  seqi:
    build: .
    container_name: seqi-webapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=change-this-to-a-very-secure-jwt-secret-key-min-32-chars
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=change-this-admin-password
      - DATABASE_PATH=/app/data/database.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - seqi_data:/app/data
      - seqi_uploads:/app/uploads

volumes:
  seqi_data:
  seqi_uploads:
